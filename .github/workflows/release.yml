# Publication automatique de Nexus.
# Declencheur : pousser un tag "vX.Y.Z" (ex. git tag v1.1.0 && git push origin v1.1.0).
# Resultat : une Release GitHub avec le zip d'installation et les fichiers de mise a jour.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version (depuis le tag)
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag invalide '${{ github.ref_name }}' : utilise vX.Y.Z" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verifier le CHANGELOG
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) {
            throw "CHANGELOG.md n'a pas de section '## [$v]' : ajoute les notes de version avant de publier."
          }

      - name: Configurer
        run: cmake -B build -A x64 -DNEXUS_VERSION=${{ steps.v.outputs.version }} -DNEXUS_UPDATE_REPO=${{ github.repository }}

      - name: Compiler
        run: cmake --build build --config Release

      - name: Preparer la release
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null

          # Fichiers distribues ET mis a jour automatiquement chez les joueurs
          $files = "NexusLauncher.exe", "Nexus.dll", "offsets.ini", "NexusTitle.mcpack"
          foreach ($f in $files) { Copy-Item "build/Release/$f" $out }

          # Notes de version = section du CHANGELOG
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes | Set-Content "$out/notes.md" -Encoding utf8

          # Manifeste lu par le launcher
          $manifest = @("version=$v")
          foreach ($line in ($notes -split "`r?`n")) {
            $t = $line.Trim().TrimStart('-', '*').Trim()
            if ($t) { $manifest += "note=- $t" }
          }
          foreach ($f in $files) {
            $h = (Get-FileHash "$out/$f" -Algorithm SHA256).Hash.ToLower()
            $manifest += "file=$f|$h"
          }
          $manifest | Set-Content "$out/nexus-update.txt" -Encoding utf8NoBOM

          # Zip de premiere installation
          Copy-Item JOUEURS.md "$out/LISEZMOI.md"
          $zipFiles = $files + "LISEZMOI.md" | ForEach-Object { "$out/$_" }
          Compress-Archive -Path $zipFiles -DestinationPath "$out/Nexus-v$v.zip" -Force
          Get-ChildItem $out

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus ${{ steps.v.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/Nexus-v${{ steps.v.outputs.version }}.zip
            dist/NexusLauncher.exe
            dist/Nexus.dll
            dist/offsets.ini
            dist/NexusTitle.mcpack
            dist/nexus-update.txt
