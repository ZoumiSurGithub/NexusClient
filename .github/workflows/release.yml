# Publication automatique de Nexus.
# Declencheur : pousser un tag "vX.Y.Z" (ex. git tag v1.1.0 && git push origin v1.1.0).
# Resultat : une Release GitHub avec le zip d'installation et les fichiers de mise a jour.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version (depuis le tag)
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag invalide '${{ github.ref_name }}' : utilise vX.Y.Z" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verifier le CHANGELOG
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) {
            throw "CHANGELOG.md n'a pas de section '## [$v]' : ajoute les notes de version avant de publier."
          }

      - name: Déposer les signatures (secret)
        shell: pwsh
        env:
          OFFSETS_INI: ${{ secrets.OFFSETS_INI }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OFFSETS_INI)) {
            throw "Le secret OFFSETS_INI est vide. Ajoute-le dans Settings > Secrets and variables > Actions (voir PUBLIER.md)."
          }
          # Le secret contient le contenu complet d'offsets.ini ; il est integre dans la DLL, jamais publie.
          $env:OFFSETS_INI | Set-Content offsets.ini -Encoding utf8NoBOM
          Write-Host "offsets.ini reconstitue depuis le secret (non versionne, non distribue)."

      - name: Configurer
        env:
          NEXUS_RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: cmake -B build -A x64 -DNEXUS_VERSION=${{ steps.v.outputs.version }} -DNEXUS_UPDATE_REPO=${{ github.repository }}

      - name: Compiler
        run: cmake --build build --config Release

      - name: Verifier la version compilee
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $gen = Get-Content build/generated/version.h -Raw
          if ($gen -notmatch "NEXUS_VERSION\s+`"$([regex]::Escape($v))`"") {
            throw "Version compilee incorrecte : version.h ne contient pas `"$v`". Contenu:`n$gen"
          }
          if ($gen -match "-dev") {
            throw "La version compilee contient '-dev' : le tag n'a pas ete pris en compte."
          }
          Write-Host "Version compilee OK : $v"

      - name: Preparer la release
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null

          # Fichiers distribues ET mis a jour automatiquement chez les joueurs
          # (CHANGELOG.md est copie a cote de l'exe par CMake : il alimente l'onglet Nouveautes)
          $files = "NexusLauncher.exe", "Nexus.dll", "NexusTitle.mcpack", "CHANGELOG.md"
          foreach ($f in $files) { Copy-Item "build/Release/$f" $out }

          # Notes de version = section du CHANGELOG
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes | Set-Content "$out/notes.md" -Encoding utf8

          # Zip unique : installation pour les joueurs ET source des mises a jour
          Copy-Item JOUEURS.md "$out/LISEZMOI.md"
          $zipName = "Nexus-v$v.zip"
          $zipFiles = $files + "LISEZMOI.md" | ForEach-Object { "$out/$_" }
          Compress-Archive -Path $zipFiles -DestinationPath "$out/$zipName" -Force

          # Manifeste lu par le launcher (version, notes, zip + fichiers a remplacer)
          $manifest = @("version=$v")
          foreach ($line in ($notes -split "`r?`n")) {
            $t = $line.Trim().TrimStart('-', '*').Trim()
            if ($t) { $manifest += "note=- $t" }
          }
          $zipHash = (Get-FileHash "$out/$zipName" -Algorithm SHA256).Hash.ToLower()
          $manifest += "package=$zipName|$zipHash"
          foreach ($f in $files) { $manifest += "apply=$f" }
          $manifest | Set-Content "$out/nexus-update.txt" -Encoding utf8NoBOM
          Get-ChildItem $out

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus ${{ steps.v.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/Nexus-v${{ steps.v.outputs.version }}.zip
            dist/nexus-update.txt
