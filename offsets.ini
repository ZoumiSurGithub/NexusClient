; =============================================================================
;  Nexus - offsets.ini
;  A mettre a jour pour TA version de Minecraft Bedrock.
;  Guide complet : docs/TROUVER_LES_OFFSETS.md
;
;  Format des signatures : octets hexa separes par des espaces, ? = joker
;     48 89 5C 24 ? 57 48 83 EC 20
;  Prefixes :
;     call:E8 ? ? ? ? 48 8B C8         -> pointe sur un CALL, on prend la cible
;     ref:3:7:48 8B 0D ? ? ? ? ...      -> rel32 a +3, instruction de 7 octets
;
;  Tant qu'une ligne obligatoire est vide, le HUD d'armure reste inactif
;  (le compteur FPS et le mode demo fonctionnent quand meme).
; =============================================================================

[game]
; Pour info seulement : la version pour laquelle ces valeurs ont ete trouvees.
version =

[player]
; Une fonction appelee a chaque tick qui recoit (dans rcx/rdx/r8/r9) un objet
; menant au joueur local. Elle doit renvoyer void, un entier ou un pointeur
; (pas un float).
; v26.63 : on hooke LocalPlayer::applyTurnDelta (appelee quand on bouge la souris) ;
; son 'this' (rcx) EST le LocalPlayer -> pointer_chain vide. Signature Latite.
hook_signature = 55 41 57 41 56 41 54 56 57 53 48 81 EC ? ? ? ? 48 8D AC 24 ? ? ? ? 44 0F 29 55 ? 44 0F 29 4D ? 44 0F 29 45 ? 0F 29 7D ? 0F 29 75 ? 48 C7 45 ? ? ? ? ? 49 89 D4
; Index de l'argument a capturer : 0 = rcx (this), 1 = rdx, 2 = r8, 3 = r9
hook_argument = 0
; Dereferencements depuis cet objet jusqu'au LocalPlayer, separes par des virgules.
; Vide : l'argument capture EST deja le LocalPlayer.
pointer_chain =

[functions]
; const ItemStack& Actor::getArmor(ArmorSlot slot) const    (slot : 0 casque .. 3 bottes)
Actor_getArmor =
; short ItemStackBase::getDamageValue() const  (signature Latite, verifiee sur v26.63 : 1 occurrence)
ItemStackBase_getDamageValue = 56 57 48 83 EC ? 48 8B 05 ? ? ? ? 48 31 E0 48 89 44 24 ? 48 8B 41 ? 48 85 C0 74 ? 48 83 38
; std::string ItemStackBase::getHoverName()  (nom affiche de l'objet ; signature Latite)
ItemStackBase_getHoverName = 55 41 57 41 56 41 54 56 57 53 48 83 EC ? 48 8D 6C 24 ? 48 C7 45 ? ? ? ? ? 48 89 D6 48 8D 55
; const ItemStack& Player::getSelectedItem() const          (optionnel : objet en main)
Player_getSelectedItem =

[offsets]
; ItemStackBase -> WeakPtr<Item> (pointeur vers un compteur dont le 1er champ est Item*)
ItemStackBase_item = 0x8
; ItemStackBase -> nombre d'items (uint8). -1 = ne pas verifier.
ItemStackBase_count = -1

[vtable]
; Index (pas l'offset en octets !) de Item::getMaxDamage() dans la vtable de Item
; v26.63 (d'apres Latite) : index 0x24.
Item_getMaxDamage = 0x24

[autosprint]
; Fonction appelee chaque tick qui recopie l'etat des touches de deplacement
; dans une structure du jeu (ex : MoveInputHandler::tick). Meme contraintes que
; [player] : retour void/entier/pointeur, 4 arguments max.
hook_signature = 
; Argument qui pointe sur la structure contenant le booleen "sprint enfonce"
hook_argument = 0
; Offset de ce booleen dans la structure (trouve avec Cheat Engine). -1 = inactif
sprint_offset = -1

[entities]
; Fonction appelee pour CHAQUE entite (ex : Actor::normalTick), avec l'Actor* dans
; l'argument hook_argument. Memes contraintes que [player].
hook_signature = 
hook_argument = 0
; Chaines depuis un Actor* : on dereference chaque valeur sauf la DERNIERE,
; qui est l'offset du champ. Ex : "0x2A0,0x0" = lire le pointeur a Actor+0x2A0,
; puis le Vec3 a +0x0 de cet objet.
; Position (Vec3 x,y,z)
position_chain = 
; Rotation (Vec2 : pitch, yaw en degres) du joueur local
rotation_chain = 
; Boite de collision (Vec3 min puis Vec3 max), optionnel : place mieux la barre
aabb_chain =
; Position de rendu interpolee (Vec3) dans l'Actor : synchro frame -> anti-saccade.
; Defaut 0x5B0. Mettre 0 pour revenir a la position physique (StateVector).
actor_renderpos = 0x5B0
; Boite de collision (AABBShapeComponent*) : min Vec3 a +0x0, max Vec3 a +0xC.
; Sert a poser la barre pile au-dessus de la hitbox. Defaut 0x248. 0 = hauteur fixe.
actor_aabb = 0x248
; int Actor::getHealth() const
Actor_getHealth = 
; int Actor::getMaxHealth() const
Actor_getMaxHealth = 
; Index vtable de ActorType Actor::getEntityTypeId() const
vtable_getEntityTypeId = -1
; Index vtable de const std::string& Actor::getNameTag() const (optionnel, noms des joueurs)
vtable_getNameTag = -1
; bool Actor::canSee(const Actor& target) const : ligne de vue a travers les blocs.
; OBLIGATOIRE : sans elle le module reste desactive (pas d'infos a travers les murs).
Actor_canSee = 
; Index vtable de bool Actor::isInvisible() const (optionnel : cache les entites invisibles)
vtable_isInvisible = -1
; Enumeration des entites via le niveau (offsets Latite, a verifier sur v26.63).
; Les logs "EL:" diront quel maillon ajuster.
clientinstance_minecraft = 0x1D0
minecraft_gamesession = 0xD0
gamesession_level = 0x40
; index vtable de getRuntimeActorList (confirme via IDA sur v26.63)
vtable_getRuntimeActorList = 0x145
; lecture directe de la liste (sans allocation) : stockage d'acteurs + resolveur
level_actor_storage = 0x4B8
actor_resolver_rva = 0x32B47A0

[zoom]
; float LevelRendererPlayer::getFov(float partialTicks, bool applyEffects)
; La fonction qui renvoie le champ de vision de la camera (prototype EXACT requis).
getFov_signature = 

[nametag]
; Fonction qui decide si le nametag d'une entite est affiche (retour bool).
; Pour le joueur local, Nexus repond "oui" : ton pseudo s'affiche en F5.
hook_signature = 
; Argument contenant l'Actor* (0 = rcx, 1 = rdx, 2 = r8, 3 = r9)
actor_argument = 0

[pointers]
; ---------------------------------------------------------------------------
;  Lecture directe par chaine de pointeurs (build sans RTTI / ECS).
;  Format : base,off1,off2,...,offsetDuChamp   (tout en hexa, separe par des virgules)
;    - 1er nombre  = RVA de la case base dans Minecraft.Windows.exe (dereferencee)
;    - nombres du milieu = dereferencements successifs
;    - dernier     = offset du champ final (ajoute, pas dereference)
;  Trouve au pointer-scan Cheat Engine (voir docs/NOTES_REVERSE.md).
;  Si une piece ne s'affiche pas alors que tu la portes : la case base est
;  peut-etre en decimal -> reconvertis-la en hexa.
; ---------------------------------------------------------------------------

; Vie du joueur local (float). base a completer (la "case base" de la chaine vie).
health =
; Vie max (float, optionnel).
health_max =

; Durabilite (= usure/damage) de chaque piece. Restant = *_max - damage.
; (chaine pointeur abandonnee, fragile entre sessions)
; helmet = 0x12968228,0x808,0x850,0x48,0x100,0x58,0x0,0xB3C
helmet =
chest  =
legs   =
boots  =

; Durabilite max par piece selon le materiau (diamant par defaut).
; cuir casque 55 / fer 165 / diamant 363 / nether 407 ; plastron diamant 528 ; jambieres 495 ; bottes 429.
helmet_max = 363
chest_max  = 528
legs_max   = 495
boots_max  = 429

[client]
; Marche de globals abandonnee (offset GameCore->MinecraftGame change en 26.63).
; On passe par le hook [player] = LocalPlayer::applyTurnDelta a la place.
; platform_gamecore_sig = ref:3:7:4C 89 3D ? ? ? ? 4D 85 FF
platform_gamecore_sig =
getlocalplayer_index = 0x1E

[items]
; Lecture de l'objet en main et de l'inventaire (offsets v26.63, d'apres Latite).
; count (uint8) dans ItemStackBase
item_count_offset = 0x22
; Item -> std::string de l'id (ex. diamond_helmet)
item_id_string_offset = 0xD8
; Player -> PlayerInventory*
player_supplies = 0x5E0
; PlayerInventory -> Inventory*
inventory_ptr = 0xB8
; PlayerInventory -> selectedSlot (int)
selected_slot = 0x10
; index vtable de Inventory::getItem(int)
getitem_vtable_index = 7

