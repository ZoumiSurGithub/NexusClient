; Manifeste des clients Nexus (exemple).
;
; Renomme ce fichier en "clients.ini" (a cote de NexusLauncher.exe) pour declarer
; quelles versions du client existent et quelles versions de Minecraft elles supportent.
;
; - Si AUCUN clients.ini n'est present, le launcher utilise simplement "Nexus.dll"
;   a cote de l'exe (compatible toutes versions) comme client "actuel".
; - Si une version de Minecraft choisie n'est supportee par AUCUN client,
;   le launcher lance Minecraft seul (sans injecter Nexus).
;
; Chaque bloc [client] accepte :
;   name   = nom affiche
;   mc     = versions MC supportees, separees par des virgules. "*" = toutes.
;            La correspondance est par prefixe : "1.21" couvre "1.21.2.2".
;   dll    = chemin local de la DLL (relatif a l'exe) -- prioritaire si present
;   url    = URL de telechargement (utilisee si la DLL locale est absente)
;   sha256 = empreinte attendue (facultatif, information)

[client]
name=Nexus 1.3.0 (Minecraft 1.21)
mc=1.21
dll=clients/Nexus-1.21.dll

[client]
name=Nexus 1.2.0 (Minecraft 1.20.80)
mc=1.20.80,1.20.7
url=https://github.com/<depot>/releases/download/v1.2.0/Nexus-1.20.dll
